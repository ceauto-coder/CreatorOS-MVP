<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CreatorOS — Creator Host</title><link rel="stylesheet" href="/static/app.css"></head>
<body><div class="shell"><header><div><span class="eyebrow">CREATOROS MVP</span><h1>Creator Host</h1><p>Tu copiloto estratégico con memoria persistente.</p></div><div class="status"><span></span> Sistema listo</div></header><main><section class="chat card"><div class="toolbar"><label>User ID <input id="userId" value="demo-user"></label><button id="newChat">Nueva sesión</button></div><div id="messages" class="messages"><div class="bubble assistant">Hola. Soy Creator Host. Puedo ayudarte a convertir una idea en contenido, estrategia y acciones concretas.</div></div><form id="chatForm"><textarea id="message" placeholder="Ej.: Dame 5 ideas de Reels sobre IA para emprendedores..." required></textarea><button>Enviar</button></form></section><aside class="dashboard card"><div class="toolbar"><h2>Memoria</h2><button id="refresh">Actualizar</button></div><div id="memoryList" class="memory-list"><p class="muted">Cargando...</p></div></aside></main></div>
<script>
let conversationId=null;const $=id=>document.getElementById(id);function addMessage(role,text){const d=document.createElement('div');d.className='bubble '+role;d.textContent=text;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight}function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function load(){const user=$('userId').value;try{const r=await fetch('/api/memories?user_id='+encodeURIComponent(user));const data=await r.json();$('memoryList').innerHTML=data.length?data.map(m=>`<div class="memory"><strong>${m.memory_type}</strong><p>${escapeHtml(m.content)}</p></div>`).join(''):'<p class="muted">Todavía no hay memorias guardadas.</p>'}catch(e){$('memoryList').innerHTML='<p class="muted">No se pudo cargar la memoria.</p>'}}$('chatForm').addEventListener('submit',async e=>{e.preventDefault();const text=$('message').value.trim();if(!text)return;addMessage('user',text);$('message').value='';const btn=e.target.querySelector('button');btn.disabled=true;btn.textContent='Pensando...';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:$('userId').value,message:text,conversation_id:conversationId})});const data=await r.json();if(!r.ok)throw new Error(data.detail||'Error');conversationId=data.conversation_id;addMessage('assistant',data.answer);load()}catch(err){addMessage('assistant','Error: '+err.message)}finally{btn.disabled=false;btn.textContent='Enviar'}});$('refresh').onclick=load;$('newChat').onclick=()=>{conversationId=null;$('messages').innerHTML='<div class="bubble assistant">Nueva sesión iniciada. ¿Qué vamos a crear?</div>'};$('userId').onchange=load;load();
</script></body></html>
